<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혼합 문항</title>
<style>
:root { --primary: #2c6e49; --primary-light: #e8f3ed; --accent: #1a5276; --border: #d5dbdb; }
* { box-sizing: border-box; }
body { font-family: "Malgun Gothic","맑은 고딕",sans-serif; margin:0; background:#f4f6f6; color:#222; line-height:1.7; }
.container { max-width:860px; margin:0 auto; padding:16px; }
header { background:var(--primary); color:#fff; padding:28px 20px; text-align:center; }
header h1 { margin:0 0 8px; font-size:1.5em; }
header p { margin:4px 0; opacity:.9; font-size:.95em; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
.tabs a {
  padding:10px 18px; background:#fff; border:1.5px solid var(--border); border-radius:8px;
  text-decoration:none; color:var(--accent); font-weight:bold; font-size:.95em;
}
.tabs a.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.tabs a:hover { background:var(--primary-light); }
.card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:20px 24px; margin:18px 0; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.md-content h1 { font-size:1.3em; color:var(--primary); border-bottom:2px solid var(--primary); padding-bottom:8px; }
.md-content h2 { font-size:1.15em; color:var(--accent); margin-top:24px; }
.md-content h3 { font-size:1.05em; }
.md-content table { border-collapse:collapse; width:100%; margin:8px 0; }
.md-content th, .md-content td { border:1px solid #999; padding:6px 10px; font-size:.93em; text-align:left; }
.md-content th { background:#eef2f0; }
.md-content blockquote { border-left:3px solid #999; margin-left:0; padding-left:12px; color:#444; background:var(--primary-light); border-radius:0 8px 8px 0; padding:12px 16px; }
.md-content hr { border:none; border-top:1px solid #ccc; margin:20px 0; }
.md-content strong { color:#1a3a2a; }
.md-content u { text-underline-offset:3px; }
.answer-section { display:none; margin-top:20px; padding:20px; background:#fef9e7; border:2px solid #d4ac0d; border-radius:10px; }
.answer-section.show { display:block; }
.toggle-btn {
  display:block; margin:20px auto; padding:14px 48px; font-size:1.1em;
  background:var(--accent); color:#fff; border:none; border-radius:8px;
  cursor:pointer; font-weight:bold; font-family:inherit;
}
.toggle-btn:hover { background:#154360; }
.note { font-size:.88em; color:#666; text-align:center; }
a.back { display:block; text-align:center; margin:16px 0; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>혼합 문항</h1>
  <p>성취기준 교차 조합 · 3세트</p>
</header>
<div class="container">
<div class="card">
  <h2 style="color:var(--primary);margin-top:0;">세트 선택</h2>
  <div class="tabs" style="flex-direction:column;">
    <a href="set1.html">혼합 세트 1 — [6실04-07] + [6실04-10] (5점)</a>
    <a href="set2.html">혼합 세트 2 — [6실04-08] + [6실04-11] (5점)</a>
    <a href="set3.html">혼합 세트 3 — [6실04-09] + [6실04-07] + [6실04-11] (4점)</a>
  </div>
</div>
<a class="back" href="../">← 전체 문항 페이지로</a>
</div>
</body>
</html>
